name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate workbook sync and reports
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          QT_QPA_PLATFORM=offscreen python -m niro --self-test
      - name: Prepare the pinned x64 NSIS toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/niro-nsis"
          cd "$RUNNER_TEMP/niro-nsis"
          curl -fsSLO https://deb.debian.org/debian/pool/main/n/nsis/nsis_3.11-1_amd64.deb
          curl -fsSLO https://deb.debian.org/debian/pool/main/n/nsis/nsis-common_3.11-1_all.deb
          sha256sum -c <<'SHA'
          e6eb6ffb70f0df09e95dedb2d2cf55ad3c2679f7c2ae357d0c00cc4c83178690  nsis_3.11-1_amd64.deb
          103a3284c1a5356efa0aba90fdfc391c3cde8e7df8726377cef0f98471584047  nsis-common_3.11-1_all.deb
          SHA
          dpkg-deb -x nsis_3.11-1_amd64.deb .
          dpkg-deb -x nsis-common_3.11-1_all.deb .
      - name: Build the offline installer
        run: |
          package="$RUNNER_TEMP/niro-nsis/usr"
          export NSISDIR="$package/share/nsis"
          python packaging/build_windows.py --makensis "$package/bin/makensis"
      - uses: actions/upload-artifact@v4
        with:
          name: NiroDesk-Windows-x64
          path: dist/NiroDesk-Setup-x64.exe*
          if-no-files-found: error

  installed-smoke:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiroDesk-Windows-x64
          path: installer
      - name: Verify checksum, installation, shortcut and offline workflow
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "installer/NiroDesk-Setup-x64.exe"
          $expected = ((Get-Content "$setup.sha256") -split '\s+')[0]
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $expected) { throw "Installer checksum mismatch" }
          $installed = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs/NiroDesk'
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (!(Test-Path (Join-Path $desktop 'Niro Desk.lnk'))) { throw "Missing desktop shortcut" }
          if (!(Test-Path (Join-Path $root 'NiroDesk.exe'))) { throw "Missing native launcher" }
          $result = Join-Path $env:RUNNER_TEMP "niro-smoke.txt"
          & "$root/app/python.exe" -I -B "$root/app/launch.py" --self-test --test-output "$result"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $result)) { throw "Installed smoke test failed" }
          Get-Content $result

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installed-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiroDesk-Windows-x64
          path: installer
      - name: Publish direct installation download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            installer/NiroDesk-Setup-x64.exe installer/NiroDesk-Setup-x64.exe.sha256 \
            --verify-tag --title "Niro Desk $GITHUB_REF_NAME" \
            --notes "Offline 64-bit Windows installer for Niro Desk. Install it, then connect your local XLSX workbook. The installer includes no personnel data."
