name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate workbook sync and reports
        shell: bash
        run: |
          core="$RUNNER_TEMP/niro-core-requirements.txt"
          grep -v '^PySide6-' requirements.txt > "$core"
          log="$RUNNER_TEMP/niro-core.log"
          if ! (python -m pip install -r "$core" && python -m unittest discover -s tests -v) 2>&1 | tee "$log"; then
            echo "::error title=Workbook and report checks::$(tail -12 "$log" | paste -sd ' ' -)"
            exit 1
          fi
      - name: Prepare the pinned x64 NSIS toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/niro-nsis"
          cd "$RUNNER_TEMP/niro-nsis"
          curl -fsSLO https://deb.debian.org/debian/pool/main/n/nsis/nsis_3.11-1_amd64.deb
          curl -fsSLO https://deb.debian.org/debian/pool/main/n/nsis/nsis-common_3.11-1_all.deb
          sha256sum -c <<'SHA'
          e6eb6ffb70f0df09e95dedb2d2cf55ad3c2679f7c2ae357d0c00cc4c83178690  nsis_3.11-1_amd64.deb
          103a3284c1a5356efa0aba90fdfc391c3cde8e7df8726377cef0f98471584047  nsis-common_3.11-1_all.deb
          SHA
          dpkg-deb -x nsis_3.11-1_amd64.deb .
          dpkg-deb -x nsis-common_3.11-1_all.deb .
      - name: Build the offline installer
        shell: bash
        run: |
          package="$RUNNER_TEMP/niro-nsis/usr"
          export NSISDIR="$package/share/nsis"
          log="$RUNNER_TEMP/niro-packaging.log"
          if ! python packaging/build_windows.py --makensis "$package/bin/makensis" 2>&1 | tee "$log"; then
            echo "::error title=NSIS packaging::$(tail -12 "$log" | paste -sd ' ' -)"
            exit 1
          fi
      - name: Bundle the installer and complete source
        shell: bash
        run: |
          version="$(python -c 'from niro import __version__; print(__version__)')"
          folder="NiroDesk-$version"
          archive="$GITHUB_WORKSPACE/dist/NiroDesk-Windows-x64-with-source.zip"
          git archive --format=zip --prefix="$folder/Source/" --output="$archive" HEAD
          mkdir -p "$RUNNER_TEMP/$folder"
          cp dist/NiroDesk-Setup-x64.exe* "$RUNNER_TEMP/$folder/"
          cd "$RUNNER_TEMP"
          zip -q -0 "$archive" "$folder/NiroDesk-Setup-x64.exe" "$folder/NiroDesk-Setup-x64.exe.sha256"
          unzip -tq "$archive"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NiroDesk-Windows-x64
          path: |
            dist/NiroDesk-Setup-x64.exe*
            dist/NiroDesk-Windows-x64-with-source.zip
          if-no-files-found: error

  installed-smoke:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NiroDesk-Windows-x64
          path: installer
      - name: Verify checksum, installation, shortcut and offline workflow
        shell: pwsh
        run: |
          try {
            $bundle = Join-Path $PWD 'installer/NiroDesk-Windows-x64-with-source.zip'
            $destination = Join-Path $env:RUNNER_TEMP 'niro-bundle'
            Expand-Archive -LiteralPath $bundle -DestinationPath $destination
            $folders = @(Get-ChildItem -LiteralPath $destination -Directory)
            if ($folders.Count -ne 1) { throw "Expected one bundle folder" }
            $folder = $folders[0].FullName
            if (!(Test-Path (Join-Path $folder 'Source/niro/__main__.py'))) { throw "Missing application source" }
            $setup = Join-Path $folder 'NiroDesk-Setup-x64.exe'
            $expected = ((Get-Content "$setup.sha256") -split '\s+')[0]
            if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $expected) { throw "Installer checksum mismatch" }
            if ((Get-FileHash 'installer/NiroDesk-Setup-x64.exe' -Algorithm SHA256).Hash -ne $expected) { throw "Standalone installer differs from bundle" }
            $installed = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
            if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
            $root = Join-Path $env:LOCALAPPDATA 'Programs/NiroDesk'
            $desktop = [Environment]::GetFolderPath('Desktop')
            if (!(Test-Path (Join-Path $desktop 'Niro Desk.lnk'))) { throw "Missing desktop shortcut" }
            if (!(Test-Path (Join-Path $root 'NiroDesk.exe'))) { throw "Missing native launcher" }
            $result = Join-Path $env:RUNNER_TEMP "niro-smoke.txt"
            $log = Join-Path $env:RUNNER_TEMP "niro-native.log"
            & "$root/app/python.exe" -I -B -X faulthandler "$root/app/launch.py" --self-test --test-output "$result" 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $result)) {
              $message = (Get-Content $log | Select-Object -Last 14) -join ' '
              throw "Installed smoke test failed with exit code ${LASTEXITCODE}. $message"
            }
            Get-Content $result
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installed Windows checks::$message"
            exit 1
          }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installed-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NiroDesk-Windows-x64
          path: installer
      - name: Publish desktop bundle and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            installer/NiroDesk-Windows-x64-with-source.zip \
            installer/NiroDesk-Setup-x64.exe installer/NiroDesk-Setup-x64.exe.sha256 \
            --verify-tag --title "Niro Desk $GITHUB_REF_NAME" \
            --notes "Download the ZIP to get the offline Windows x64 installer and full source code in one folder. Extract the archive, run NiroDesk-Setup-x64.exe, then connect your local XLSX workbook."
